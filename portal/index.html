<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#9c6e38"/>
<title>البوابة الداخلية — جمعية إرث وحضارة بالقريات</title>
<meta name="description" content="البوابة الداخلية للموظفين — جمعية إرث وحضارة بالقريات. إدارة الملفات والمهام والاعتمادات والإشعارات.">
<meta name="robots" content="noindex, nofollow"/>
<link rel="icon" type="image/x-icon" href="/favicon.ico"/>
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png"/>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"/>

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="بوابة إرث"/>
<meta name="mobile-web-app-capable" content="yes"/>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link rel="stylesheet" href="portal.css"/>
</head>
<body>

<div class="grain"></div>

<!-- ════════ شاشة التحميل ════════ -->
<div id="bootScreen">
  <img class="boot-logo" src="../assets/الشعار/الشعار.png" alt="شعار الجمعية">
  <div class="boot-orn"><span class="l"></span><span class="d"></span><span class="l r"></span></div>
  <div class="boot-txt">جارٍ تحميل البوابة…</div>
</div>

<!-- ════════ شاشة الدخول ════════ -->
<div id="loginScreen" class="hidden">
  <div class="login-box">
    <img class="login-logo" src="../assets/الشعار/الشعار.png" alt="شعار الجمعية">
    <div class="login-brand">جمعية إرث وحضارة بالقريات</div>
    <div class="login-sub">Internal Employee Portal</div>
    <div class="login-orn"><span class="l"></span><span class="d"></span><span class="l r"></span></div>

    <form class="login-card" id="loginForm" autocomplete="on">
      <div class="login-title">تسجيل الدخول</div>
      <div class="login-title-la">Sign in to your account</div>

      <div class="login-field">
        <label for="loginEmail">البريد الإلكتروني</label>
        <div class="login-input-wrap">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="loginEmail" placeholder="name@erth.sa" autocomplete="username" required>
        </div>
      </div>

      <div class="login-field">
        <label for="loginPass">كلمة المرور</label>
        <div class="login-input-wrap">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password" required>
        </div>
      </div>

      <div class="login-err" id="loginErr"></div>

      <button type="submit" class="login-btn" id="loginBtn">
        <i class="fa-solid fa-right-to-bracket"></i> تسجيل الدخول
      </button>
    </form>

    <a href="../index.html" class="login-back"><i class="fa-solid fa-arrow-right"></i> العودة إلى الموقع</a>
    <div class="login-foot">© 2026 جمعية إرث وحضارة بالقريات</div>
  </div>
</div>

<!-- ════════ التطبيق ════════ -->
<div id="appShell">

  <!-- الشريط الجانبي -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img class="brand-logo" src="../assets/الشعار/الشعار.png" alt="شعار">
      <div class="brand-text">
        <span class="ar">إرث وحضارة</span>
        <span class="la">Employee Portal</span>
      </div>
    </div>
    <div class="nav-wrap" id="navWrap"></div>
    <div class="sidebar-foot" id="sidebarFoot"></div>
  </aside>

  <!-- المحتوى -->
  <div class="main">
    <div class="topbar">
      <button class="menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
      <div class="crumbs">
        <span class="crumb" id="crumbLa">Dashboard</span>
        <span class="crumb-sep"><i class="fa-solid fa-chevron-left"></i></span>
        <span class="crumb-cur" id="crumbCur">الرئيسية</span>
      </div>
      <div class="topbar-actions">
        <button class="tb-btn" id="bellBtn" title="الإشعارات">
          <i class="fa-solid fa-bell"></i>
          <span class="tb-dot" id="tbDot"></span>
        </button>
      </div>
    </div>

    <div class="page-wrap">
      <div class="view active" id="viewHost"></div>
    </div>
  </div>
</div>

<!-- لوحة الإشعارات المنسدلة -->
<div class="notif-panel" id="notifPanel"></div>

<!-- المودال -->
<div class="modal-shroud" id="modalShroud">
  <div class="modal" id="modal"></div>
</div>

<!-- التوست -->
<div class="toast" id="toast"><i class="fa-solid fa-circle-check" id="toastIco"></i><span id="toastMsg"></span></div>

<!-- سكرين الجوال -->
<div class="scrim" id="scrim"></div>

<script type="module" src="app.js"></script>
</body>
</html>
